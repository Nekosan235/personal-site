<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="csrf-token" content="{{CSRF_TOKEN}}">
    <meta name="description" content="登录个人空间，查看服务器概况与常用工具。">
    <title>登录 · 个人空间</title>
    <script src="/assets/theme-bootstrap.js?v=1.4.0"></script>
    <link rel="icon" href="/assets/favicon.svg?v=1.4.0" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/vendor/tabler/tabler.min.css?v=1.6.1">
    <link rel="stylesheet" href="/assets/styles.css?v=1.9.0">
    <script type="module" src="/assets/login.js?v=1.8.0"></script>
  </head>
  <body class="login-body">
    <button id="login-appearance" class="login-appearance btn btn-ghost-secondary" type="button" aria-haspopup="dialog">外观设置</button>
    <main class="login-layout">
      <a class="brand login-brand" href="/login" aria-label="个人空间">
        <span class="brand-mark" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg>
        </span>
        <span><strong>个人空间</strong><small>设备与工具工作台</small></span>
      </a>
      <section class="login-panel card card-md" aria-labelledby="login-title">
        <div class="login-panel-content card-body">
          <h1 id="login-title" class="card-title">登录你的工作台</h1>
          <p class="section-description">管理云端设备，打开常用工具。</p>
          <form id="login-form" class="login-form" method="post" action="/login" autocomplete="on">
            <div class="form-field">
              <label class="form-label" for="username">用户名</label>
              <input class="form-control" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="输入用户名" required maxlength="128"{{USERNAME_ATTR}}>
            </div>
            <input id="csrf-token" name="csrf_token" type="hidden" value="{{CSRF_TOKEN}}">
            <div class="form-field">
              <label class="form-label" for="password">密码</label>
              <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" placeholder="输入密码" required maxlength="1024">
            </div>
            <p id="login-error" class="form-error alert alert-danger" role="alert"{{LOGIN_ERROR_ATTR}}>{{LOGIN_ERROR}}</p>
            <button id="login-submit" class="btn btn-primary login-submit" type="submit">登录</button>
          </form>
          <p class="login-private-note">此空间仅向已授权的账户开放。</p>
        </div>
      </section>
      <p class="login-footnote">你的设备，你的工作台。</p>
    </main>
  </body>
</html>
